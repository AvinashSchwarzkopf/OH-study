/*
 * CSS for jsPsych experiments.
 *
 * This stylesheet provides minimal styling to make jsPsych
 * experiments look polished without any additional styles.
 */
/* Container holding jsPsych content */
.jspsych-display-element {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.jspsych-display-element:focus {
  outline: none;
}

.jspsych-content-wrapper {
  display: flex;
  margin: auto;
  flex: 1 1 100%;
  width: 100%;
}

.jspsych-content {
  text-align: center;
  margin: auto; /* this is for overflowing content */
}

.jspsych-top {
  align-items: flex-start;
}

.jspsych-middle {
  align-items: center;
}

/* fonts and type */
.jspsych-display-element {
  font-family: "Open Sans", "Arial", sans-serif;
  font-size: 18px;
  line-height: 1.6em;
}

/* Form elements like input fields and buttons */
.jspsych-display-element input[type=text] {
  font-family: "Open Sans", "Arial", sans-serif;
  font-size: 14px;
}

/* Buttons and Button Groups */
.jspsych-btn-group-flex {
  display: flex;
  justify-content: center;
}

.jspsych-btn-group-grid {
  display: grid;
  grid-auto-columns: max-content;
  max-width: fit-content;
  margin-right: auto;
  margin-left: auto;
}

.jspsych-btn {
  display: inline-block;
  padding: 8px 12px;
  margin: 0.75em;
  font-size: 14px;
  font-weight: 400;
  font-family: "Open Sans", "Arial", sans-serif;
  cursor: pointer;
  line-height: 1.4;
  text-align: center;
  white-space: nowrap;
  vertical-align: middle;
  background-image: none;
  border: 1px solid transparent;
  border-radius: 4px;
  color: #333;
  background-color: #fff;
  border-color: #ccc;
}

/* only apply the hover style on devices with a mouse/pointer that can hover - issue #977 */
@media (hover: hover) {
  .jspsych-btn:hover {
    background-color: #ddd;
    border-color: #aaa;
  }
}
.jspsych-btn:active {
  background-color: #ddd;
  border-color: #000000;
}

.jspsych-btn:disabled {
  background-color: #eee;
  color: #aaa;
  border-color: #ccc;
  cursor: not-allowed;
}

/* custom style for input[type="range] (slider) to improve alignment between positions and labels */
.jspsych-slider {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  width: 100%;
  background: transparent;
}

.jspsych-slider:focus {
  outline: none;
}

.jspsych-slider::-webkit-slider-runnable-track {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 8px;
  cursor: pointer;
  background: #eee;
  box-shadow: 0px 0px 0px #000000, 0px 0px 0px #0d0d0d;
  border-radius: 2px;
  border: 1px solid #aaa;
}

.jspsych-slider::-moz-range-track {
  appearance: none;
  width: 100%;
  height: 8px;
  cursor: pointer;
  background: #eee;
  box-shadow: 0px 0px 0px #000000, 0px 0px 0px #0d0d0d;
  border-radius: 2px;
  border: 1px solid #aaa;
}

.jspsych-slider::-ms-track {
  appearance: none;
  width: 99%;
  height: 14px;
  cursor: pointer;
  background: #eee;
  box-shadow: 0px 0px 0px #000000, 0px 0px 0px #0d0d0d;
  border-radius: 2px;
  border: 1px solid #aaa;
}

.jspsych-slider::-webkit-slider-thumb {
  border: 1px solid #666;
  height: 24px;
  width: 15px;
  border-radius: 5px;
  background: #ffffff;
  cursor: pointer;
  -webkit-appearance: none;
  margin-top: -9px;
}

.jspsych-slider::-moz-range-thumb {
  border: 1px solid #666;
  height: 24px;
  width: 15px;
  border-radius: 5px;
  background: #ffffff;
  cursor: pointer;
}

.jspsych-slider::-ms-thumb {
  border: 1px solid #666;
  height: 20px;
  width: 15px;
  border-radius: 5px;
  background: #ffffff;
  cursor: pointer;
  margin-top: -2px;
}

/* progress bar */
#jspsych-progressbar-container {
  color: #555;
  border-bottom: 1px solid #dedede;
  background-color: #f9f9f9;
  margin-bottom: 1em;
  text-align: center;
  padding: 8px 0px;
  width: 100%;
  line-height: 1em;
}

#jspsych-progressbar-container span {
  font-size: 14px;
  padding-right: 14px;
}

#jspsych-progressbar-outer {
  background-color: #eee;
  width: 50%;
  margin: auto;
  height: 14px;
  display: inline-block;
  vertical-align: middle;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
}

#jspsych-progressbar-inner {
  background-color: #aaa;
  width: 0%;
  height: 100%;
}

/* Appearance of jsPsych.data.displayData() */
#jspsych-data-display {
  text-align: left;
}

:root{
  --bg:#f7f6f3; --ink:#26241f; --muted:#6d6a63; --line:#dedbd4; --card:#fff;
  --A:#2457c5; --B:#d32f2f; --C:#2e8b3d; --D:#111111; --X:#7a7a7a;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.55;
}
#jspsych-target{max-width:860px; margin:0 auto; padding:40px 24px 80px;}
#study-progress{max-width:860px; margin:20px auto 0; padding:0 24px;}
.study-progress-track{width:100%; height:14px; background:#e9e6df; border-radius:999px; overflow:hidden; border:1px solid var(--line);}
.study-progress-fill{width:0%; height:100%; background:linear-gradient(90deg, var(--A), var(--C)); transition:width .25s ease;}
.study-progress-label{margin-top:8px; text-align:right; color:var(--muted); font-size:12px; font-weight:600; letter-spacing:.04em;}
.consent-pdf-page{padding-top:18px}
.consent-pdf-shell{display:flex; align-items:center; justify-content:center; gap:18px; margin:18px 0 12px}
.consent-pdf-viewer{width:min(100%, 760px); background:#f7f6f3; border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center}
#consent-pdf-canvas{max-width:100%; border-radius:8px; border:1px solid var(--line); background:#fff; display:block; margin:0 auto}
.consent-pdf-status, .consent-pdf-pagecount{font-size:13px; color:var(--muted); margin-bottom:10px}
.consent-pdf-arrow{width:52px; height:52px; border:1px solid var(--line); border-radius:50%; background:#fff; color:var(--ink); font-size:28px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.05)}
.consent-pdf-arrow:disabled{opacity:.35; cursor:default}
#jspsych-html-button-response-btngroup{display:flex; justify-content:center; align-items:center; margin-top:18px}
#jspsych-html-button-response-btngroup .jspsych-btn,
#jspsych-html-button-response-btngroup .jspsych-btn.wide{
  display:block;
  width:100%;
  max-width:420px;
  min-width:0;
  margin:0 auto;
  padding:18px 24px;
  font-size:22px;
  font-weight:600;
  line-height:1.2;
  text-align:center;
  border-radius:12px;
  border:1px solid #d7d2cc;
  background:#f2f0ee;
  color:#2f2d2a;
  box-shadow:none;
}
#jspsych-html-button-response-btngroup .jspsych-btn:hover,
#jspsych-html-button-response-btngroup .jspsych-btn:active{
  background:#ece8e3;
  border-color:#cfc9c2;
}
.jspsych-content{max-width:860px}
h1{font-size:28px; margin:0 0 18px} h2{font-size:22px; margin:0 0 14px}
p{margin:0 0 14px}
.screen{text-align:center}
.screen.text{text-align:left; background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:28px 32px; box-shadow:0 1px 2px rgba(0,0,0,.04)}
.screen.text ul{margin:0 0 14px 20px; padding:0} .screen.text li{margin-bottom:8px}
.hint{color:var(--muted); font-size:15px}
.warn{color:#a3341f}
.prompt{font-size:20px; font-weight:600; margin-top:26px}

/* --- the bags, stacked oldest first --- */
/* Column of rows; a fixed-width label keeps "Bag n" lined up down the
   page, and every row is the same width so the finished cards align. */
.bags{display:inline-flex; flex-direction:column; align-items:stretch;
  gap:10px; margin:6px 0 4px; text-align:left}
.bagrow{display:flex; align-items:center; gap:14px; padding:7px 14px 7px 10px;
  border:1px solid transparent; border-radius:13px}
.rowlab{flex:0 0 60px; display:flex; align-items:center; gap:7px;
  justify-content:flex-end; color:var(--muted); font-size:13px;
  letter-spacing:.03em; white-space:nowrap}
.bagrow.current .rowlab{color:var(--ink); font-weight:600}
/* A finished bag becomes its own card. */
.bagrow.done{background:var(--card); border-color:var(--line);
  box-shadow:0 1px 2px rgba(0,0,0,.05)}
.bagrow.done .rowlab, .bagrow.done .tiles{opacity:.75}
.tiles{display:flex; align-items:flex-start; gap:6px; flex-wrap:wrap; min-height:44px}
.bagrow.done .tiles{min-height:32px}
.tiles.demo{justify-content:flex-start; margin:16px 0 20px}

/* a tile with its color name underneath, for anyone who can't tell the colors apart */
.tilewrap{display:inline-flex; flex-direction:column; align-items:center; gap:3px}
.tilename{font-size:11px; line-height:1; color:var(--muted); text-transform:lowercase}
.bagrow.done .tilename{font-size:9px}
.tile{width:42px; height:42px; flex:0 0 auto; border-radius:9px; color:#fff;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:0; font-weight:700; background:var(--X);
  box-shadow:0 1px 2px rgba(0,0,0,.18)}
.bagrow.done .tile{width:30px; height:30px; font-size:0; border-radius:7px}
.tile-A{background:var(--A)} .tile-B{background:var(--B)}
.tile-C{background:var(--C)} .tile-D{background:var(--D)}
.choice-swatch{display:inline-block; vertical-align:middle; width:18px; height:18px; margin-right:6px; border-radius:5px; box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* still in the bag: face down, letter hidden */
.tile-slot{background:#e9e6df; border:1px solid #d9d5cc; color:#b4afa5;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.07)}
.tile-slot.tile-next{background:#f3f0e9; border:2px solid #8d887e;
  color:var(--muted)}
.tile-new{animation:pop .28s ease-out; outline:3px solid #26241f; outline-offset:2px}
@keyframes pop{from{transform:scale(.4); opacity:0} to{transform:scale(1); opacity:1}}
@media (prefers-reduced-motion:reduce){ .tile-new{animation:none} }

.caption{margin-top:20px; min-height:28px}
/* marks the warm-up block, so practice is never mistaken for the study */
.tag{display:inline-block; margin-bottom:10px; padding:2px 11px; border-radius:20px;
  background:#e8e4db; color:var(--muted); font-size:11px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase}
.chose{font-size:16px; color:var(--muted)}
.chose b{color:var(--ink); font-weight:600}

/* --- buttons --- */
#jspsych-html-button-response-btngroup{display:flex; gap:12px;
  justify-content:center; flex-wrap:wrap; margin-top:26px}
.jspsych-btn{margin:0; font-size:17px; padding:11px 20px; border-radius:10px;
  border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
  font-family:inherit; transition:transform .06s ease, box-shadow .15s ease}
.jspsych-btn:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.jspsych-btn:active{transform:translateY(1px)}
.jspsych-btn.wide{min-width:280px; text-align:left}
#jspsych-html-button-response-btngroup .jspsych-btn.tile-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:74px; height:74px; min-width:0; max-width:none; margin:0; padding:0;
  border:none; border-radius:9px; font-size:0; font-weight:700; line-height:1;
  color:#fff; background:var(--X); box-shadow:0 1px 2px rgba(0,0,0,.18);
}
#jspsych-html-button-response-btngroup .jspsych-btn.tile-btn:hover,
#jspsych-html-button-response-btngroup .jspsych-btn.tile-btn:active{
  box-shadow:0 1px 2px rgba(0,0,0,.18); transform:none;
}
#jspsych-html-button-response-btngroup .jspsych-btn.tile-btn.tile-A{background:var(--A)}
#jspsych-html-button-response-btngroup .jspsych-btn.tile-btn.tile-B{background:var(--B)}
#jspsych-html-button-response-btngroup .jspsych-btn.tile-btn.tile-C{background:var(--C)}
#jspsych-html-button-response-btngroup .jspsych-btn.tile-btn.tile-D{background:var(--D)}

.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:26px;
  letter-spacing:.08em; background:#26241f; color:#fff; padding:14px 20px;
  border-radius:10px; display:inline-block; margin:6px 0 16px}
textarea,input,select{font-family:inherit; font-size:16px; padding:8px;
  border:1px solid var(--line); border-radius:8px; background:#fff}
.jspsych-btn.go{min-width:200px; font-weight:600}
.kbd{display:inline-block; margin-left:8px; padding:1px 7px; border-radius:5px;
  border:1px solid var(--line); background:var(--bg); color:var(--muted);
  font-size:12px; letter-spacing:.04em; vertical-align:1px}

@media (max-width:640px){
  #jspsych-target{padding:24px 14px 60px}
  .bags{gap:8px}
  .bagrow{gap:9px; padding:6px 9px}
  .rowlab{flex-basis:46px; font-size:12px}
  .tile-btn{width:60px; height:60px; font-size:26px}
  .prompt{font-size:18px}
  h1{font-size:24px} h2{font-size:20px}
  #jspsych-html-button-response-btngroup{gap:10px}
}

/* --- developer panel (?dev=1) --- */
#devpanel{position:fixed; top:14px; right:14px; z-index:99; width:212px;
  background:var(--card); border:1px solid var(--line); border-radius:11px;
  box-shadow:0 4px 18px rgba(0,0,0,.10); font-size:12px; line-height:1.45;
  overflow:hidden}
#devpanel .dp-head{display:flex; justify-content:space-between; align-items:center;
  padding:5px 8px 5px 11px; background:#26241f; color:#fff;
  font-size:10px; font-weight:700; letter-spacing:.14em}
#devpanel .dp-head button{background:none; border:none; color:#fff; cursor:pointer;
  font-size:15px; line-height:1; padding:0 3px; font-family:inherit}
#devpanel.folded .dp-body{display:none}
#devpanel .dp-body{padding:11px}
#devpanel .dp-group{color:var(--muted); font-size:10px; letter-spacing:.07em;
  text-transform:uppercase}
#devpanel .dp-name{font-size:15px; font-weight:700; margin-bottom:7px;
  line-height:1.25}
#devpanel .dp-status{background:var(--bg); border-radius:6px; padding:5px 8px;
  color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px; margin-bottom:9px}
#devpanel .dp-bags{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px; color:var(--muted); margin-bottom:10px; letter-spacing:.5px}
#devpanel .dp-bags span{display:inline-block; width:15px; color:#a9a49a}
#devpanel .dp-field{display:block; color:var(--muted); font-size:10px;
  letter-spacing:.07em; text-transform:uppercase}
#devpanel select{width:100%; margin-top:4px; font-size:12px; padding:5px 6px;
  border:1px solid var(--line); border-radius:7px; background:#fff}
#devpanel .dp-check{display:flex; align-items:center; gap:6px; margin-top:8px;
  color:var(--muted); font-size:11px; text-transform:none; letter-spacing:0}
#devpanel .dp-check input{width:auto; margin:0}
#devpanel .dp-links{display:flex; gap:10px; margin-top:9px; padding-top:8px;
  border-top:1px solid var(--line)}
#devpanel a{color:var(--A); font-size:11px; text-decoration:none}
#devpanel a:hover{text-decoration:underline}
@media (max-width:860px){ #devpanel{position:static; width:auto; margin:0 auto 18px} }

</style>
</head>

/* ------------------------------------------------------------------
   OH Study - all study-level knobs live here.
   ------------------------------------------------------------------ */
const CONFIG = {

  // ---- Design ----------------------------------------------------
  // The design CSV is split into two studies (its "Group 1" and
  // "Group 2" tables); each participant runs exactly one. The study
  // link decides which: ?study=1 or ?study=2 (works inside JATOS too).
  // This value is used only when the link carries no study:
  //   "balanced" - inside JATOS, give each participant whichever study
  //                has fewer completed participants (counted in the
  //                JATOS batch session). Outside JATOS: a coin flip.
  //   "random"   - a coin flip per participant (balanced on average).
  //   1 or 2     - everyone runs that study.
  STUDY: "balanced",

  // How many patterns (= CSV rows) each participant sees, in a random
  // order. "all" runs every eligible pattern in one session; a number
  // runs that many. Note the carry-over: having just learned
  // "Alternating" changes how a person approaches "Grow", and with
  // "all" that applies to every pattern after the first.
  PATTERNS_PER_PARTICIPANT: "all",

  // Patterns whose bags contain characters outside A-D are held out of
  // random assignment (currently: "Bracketing", bag 4 = DANCDNCD).
  // Set false to run them anyway; the extra letter gets its own button.
  EXCLUDE_INVALID_PATTERNS: true,

  // Restrict assignment to specific pattern ids (from js/patterns.js).
  // e.g. ["identity", "alternating"].  Empty = all eligible patterns.
  ONLY_PATTERNS: [],

  // Randomly remap A/B/C/D to a fresh permutation for each participant,
  // so alphabetical order can't be confused with sequence structure.
  // The mapping is stored in the data. Off = shown exactly as in the CSV.
  COUNTERBALANCE_LETTERS: false,

  // ---- Practice --------------------------------------------------
  // A warm-up before the study proper. Identity (AAAAA / BBBBB / ...)
  // is the easiest pattern, so it teaches the mechanics without
  // teaching a rule worth transferring. The practice pattern is
  // dropped from the main assignment so nobody sees it twice, and its
  // rows are flagged is_practice. Set to "" for no practice.
  PRACTICE_PATTERN: "identity_practice",
  PRACTICE_SEQUENCES: 4,     // how many of its four sequences to run

  // ---- Trial flow ------------------------------------------------
  ASK_ON_FIRST_DRAW: true,   // predict draw 1 of a bag (a pure guess; useful baseline)
  SHOW_CHOICE_ECHO: true,    // echo "You chose X" under the bags after each draw
  // false = the letter buttons must be clicked; the A/B/C/D keys do
  // nothing. (The spacebar shortcut on Next/Begin/Continue screens is
  // separate and always on.)
  ALLOW_KEYBOARD: false,

  // ---- Participant-facing copy ----------------------------------
  // The participant-facing word for one run of items (was "bag").
  // Row labels, buttons and screen copy all follow it.
  SEQ_WORD: "sequence",
  ESTIMATED_MINUTES: 15,     // per study: ~8 patterns, ~250 draws; re-time it after a pilot
  PAYMENT_TEXT: "$1.50",

  // ---- Development ----------------------------------------------
  // Panel showing the running rule, with a jump-to-any-rule menu.
  // Leave false and use ?dev=1 when you need it - never on for a live HIT.
  DEV_PANEL: false,

  // ---- Data ------------------------------------------------------
  // POST endpoint for saving. server.py implements /save.
  // Leave "" to skip the upload (data is still offered as a download).
  SAVE_URL: "",
  // Save partial data in the background while the participant is running.
  // This is especially useful on Prolific/JATOS where a late dropout can
  // still leave a useful partial dataset behind.
  AUTO_SAVE: true,
  AUTO_SAVE_INTERVAL_MS: 15000,

  // ---- JATOS -----------------------------------------------------
  // When the study runs inside JATOS (jatos.js loaded), data goes to
  // JATOS instead of SAVE_URL - these knobs are ignored otherwise.
  // What to send as result data: "csv", "json", or "both".
  JATOS_RESULT_FORMAT: "csv",
  // Also attach the CSV as a downloadable result file (JATOS 3.7.1+).
  JATOS_UPLOAD_FILE: true,
  // true  = show the completion code with a "Finish" button that ends
  //         the study (participant can copy the code first).
  // false = end the study immediately after saving (JATOS redirects to
  //         its end page / the batch's end-URL, e.g. Prolific).
  JATOS_END_BUTTON: true,
  COMPLETION_CODE_PREFIX: "OH"
};

</script>
<script>
/* ------------------------------------------------------------------
   OH Study - sequence prediction from bags
   Flow per pattern: 4 bags in order. For each bag, on every draw the
   participant predicts the next item, then the item is drawn and shown.
   When the bag empties, the next bag begins - with every earlier bag
   still on screen.
   ------------------------------------------------------------------ */

/* ---------- URL / MTurk parameters -------------------------------- */
const params = new URLSearchParams(window.location.search);
const TURK = {
  assignmentId: params.get("assignmentId") || "",
  hitId: params.get("hitId") || "",
  workerId: params.get("workerId") || "",
  turkSubmitTo: params.get("turkSubmitTo") || ""
};
// MTurk sends this exact string while a worker is only previewing the HIT.
const IS_MTURK_PREVIEW = TURK.assignmentId === "ASSIGNMENT_ID_NOT_AVAILABLE";
const FORCE_PATTERN = params.get("pattern");   // ?pattern=alternating for piloting
const CONSENT_PDF_NAME = "consent_form.pdf";

const COMPLETION_CODE =
  CONFIG.COMPLETION_CODE_PREFIX + "-" +
  Math.random().toString(36).slice(2, 6).toUpperCase() +
  Math.random().toString(36).slice(2, 6).toUpperCase();

/* ---------- Study assignment -------------------------------------- */
/* Which half of the design this session runs. The link's ?study= wins;
   inside JATOS the link's query arrives as jatos.urlQueryParameters, so
   main.js passes those in. Falls back to CONFIG.STUDY. */
let STUDY = null;

function knownStudies() {
  return [...new Set(PATTERNS.flatMap(p => p.studies))].sort();
}

/* The study the link (or a fixed CONFIG.STUDY) names, or null when
   neither picks one. */
function linkStudy(linkParams) {
  const raw = (linkParams && linkParams.study) || params.get("study") || CONFIG.STUDY;
  return knownStudies().includes(Number(raw)) ? Number(raw) : null;
}

function resolveStudy(linkParams) {
  const fixed = linkStudy(linkParams);
  if (fixed !== null) return fixed;
  const raw = String((linkParams && linkParams.study) || params.get("study") || CONFIG.STUDY);
  if (raw === "balanced") console.warn('"balanced" needs JATOS; assigning at random.');
  else if (raw !== "random") console.warn('Unknown study "' + raw + '"; assigning at random.');
  return jsPsych.randomization.sampleWithoutReplacement(knownStudies(), 1)[0];
}

/* ---------- Pattern assignment ------------------------------------ */
function eligiblePatterns() {
  let ps = PATTERNS.filter(p => p.studies.includes(STUDY));
  // The practice pattern is spent on practice; seeing it twice would
  // make its second run an odd hybrid of practice and data.
  if (CONFIG.PRACTICE_PATTERN) {
    ps = ps.filter(p => p.id !== CONFIG.PRACTICE_PATTERN);
  }
  if (CONFIG.EXCLUDE_INVALID_PATTERNS) {
    const dropped = ps.filter(p => !p.valid).map(p => p.name);
    if (dropped.length) {
      console.warn("Held out of assignment (non-ABCD characters in a bag): " +
                   dropped.join(", ") + ". Fix the CSV cell, re-run " +
                   "build_patterns.py, or set EXCLUDE_INVALID_PATTERNS=false.");
    }
    ps = ps.filter(p => p.valid);
  }
  if (CONFIG.ONLY_PATTERNS.length) {
    ps = ps.filter(p => CONFIG.ONLY_PATTERNS.includes(p.id));
  }
  return ps;
}

function assignPatterns() {
  const pool = eligiblePatterns();
  if (FORCE_PATTERN) {
    const hit = PATTERNS.filter(p => p.id === FORCE_PATTERN);
    if (hit.length) return hit;
    console.warn('No pattern with id "' + FORCE_PATTERN + '"; assigning at random.');
  }
  const n = CONFIG.PATTERNS_PER_PARTICIPANT === "all"
    ? pool.length
    : Math.min(CONFIG.PATTERNS_PER_PARTICIPANT, pool.length);
  return jsPsych.randomization.sampleWithoutReplacement(pool, n);
}

/* Random A/B/C/D relabelling (optional counterbalancing). */
function makeLetterMap(pattern) {
  const base = ["A", "B", "C", "D"];
  const extra = [...new Set(pattern.bags.join("").split(""))].filter(c => !base.includes(c));
  const map = {};
  if (CONFIG.COUNTERBALANCE_LETTERS) {
    const shuffled = jsPsych.randomization.shuffle(base);
    base.forEach((c, i) => { map[c] = shuffled[i]; });
  } else {
    base.forEach(c => { map[c] = c; });
  }
  extra.forEach(c => { map[c] = c; });
  return map;
}

/* ---------- Display helpers --------------------------------------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* "sequence" -> "Sequence", for row labels and headings. */
function capWord(w) { return w.charAt(0).toUpperCase() + w.slice(1); }

const COLOR_NAMES = {
  A: "blue",
  B: "red",
  C: "green",
  D: "black"
};

function colorName(letter) {
  return COLOR_NAMES[letter] || "neutral";
}

function tile(letter, extraClass) {
  return '<span class="tilewrap">' +
           '<span class="tile tile-' + letter + ' ' + (extraClass || '') + '" ' +
           'title="' + escapeHtml(colorName(letter)) + '" ' +
           'aria-label="' + escapeHtml(colorName(letter)) + '"></span>' +
           '<span class="tilename">' + escapeHtml(colorName(letter)) + '</span>' +
         '</span>';
}

/* One face-down slot for an item still in the bag. The slot that is
   about to be drawn is marked, so the participant can see how much is
   left and exactly which position their guess is about. */
function slot(isNext) {
  return '<span class="tile tile-slot' + (isNext ? ' tile-next' : '') + '">' +
         (isNext ? '?' : '') + '</span>';
}

function bagRow(index, items, opts) {
  opts = opts || {};
  const tiles = items.map((l, i) =>
    tile(l, opts.newAt === i ? "tile-new" : "")).join("");
  let slots = "";
  for (let i = 0; i < (opts.remaining || 0); i++) {
    slots += slot(i === 0 && opts.awaiting);
  }
  return '<div class="bagrow' + (opts.current ? ' current' : ' done') + '">' +
           '<div class="rowlab">' +
             '<span>' + capWord(CONFIG.SEQ_WORD) + ' ' + index + '</span>' +
           '</div>' +
           '<div class="tiles">' + tiles + slots + '</div>' +
         '</div>';
}

/* history: [[letters of bag 1], ...] for bags already emptied.
   current: {index, items, remaining, awaiting, newAt} for the bag in play. */
function scene(history, current, caption) {
  const rows = history.map((items, i) => bagRow(i + 1, items, {}));
  if (current) {
    rows.push(bagRow(current.index, current.items, {
      current: true, remaining: current.remaining,
      awaiting: current.awaiting, newAt: current.newAt
    }));
  }
  /* The caption slot is kept even when empty, so the prompt below it
     does not jump between the first draw of a bag and the rest. */
  return '<div class="scene"><div class="bags">' + rows.join("") + '</div>' +
         (caption == null ? '' : '<div class="caption">' + caption + '</div>') +
         '</div>';
}

/* Let A/B/C/D keys stand in for button clicks. */
function attachKeyboard(choices) {
  if (!CONFIG.ALLOW_KEYBOARD) return null;
  const handler = e => {
    const idx = choices.indexOf(e.key.toUpperCase());
    if (idx === -1) return;
    const btn = document.querySelector('.jspsych-btn[data-choice="' + idx + '"]');
    if (btn) { e.preventDefault(); btn.click(); }
  };
  document.addEventListener("keydown", handler);
  return handler;
}

/* A "press on" screen: a real button, plus the spacebar as a shortcut.
   (A keyboard-only screen strands anyone whose focus is elsewhere.) */
function continueTrial(stimulus, data, label, after) {
  let keyHandler = null;
  return {
    type: jsPsychHtmlButtonResponse,
    stimulus: stimulus,
    choices: [label || "Continue"],
    button_html: (c, i) => '<button class="jspsych-btn go" data-choice="' + i + '">' +
                           c + ' <span class="kbd">space</span></button>',
    on_load: () => {
      keyHandler = e => {
        if (e.key !== " " && e.key !== "Spacebar" && e.code !== "Space") return;
        const btn = document.querySelector('.jspsych-btn.go');
        if (btn) { e.preventDefault(); btn.click(); }
      };
      document.addEventListener("keydown", keyHandler);
    },
    on_finish: () => {
      document.removeEventListener("keydown", keyHandler);
      if (after) after();
    },
    data: data
  };
}

/* ---------- Build the trial timeline for one pattern -------------- */
/* opts: {practice: true, nBags: n} for the warm-up block. */
function patternTimeline(pattern, patternIndex, nPatterns, opts) {
  opts = opts || {};
  const map = makeLetterMap(pattern);
  const source = opts.nBags ? pattern.bags.slice(0, opts.nBags) : pattern.bags;
  const sourceForDisplay = opts.practice
    ? source.map(b => b.slice(0, 4))
    : source;
  const bags = sourceForDisplay.map(b => b.split("").map(c => map[c]));
  const tag = opts.practice ? '<div class="tag">practice</div>' : '';
  const choices = [...new Set(pattern.bags.join("").split("").map(c => map[c])
                              .concat(["A", "B", "C", "D"]))].sort();

  const timeline = [];
  const history = [];   // bags already emptied, in order

  /* The draw and the next prediction share one screen, so nothing is
     timed: the item that just came out is on screen, labelled with what
     the participant guessed, while the next guess is being made. */
  let lastChoice = null;
  const echo = () =>
    (CONFIG.SHOW_CHOICE_ECHO && lastChoice)
      ? '<span class="chose">You chose <span class="choice-swatch tile-' + lastChoice + '"></span> <b>' + escapeHtml(colorName(lastChoice)) + '</b></span>'
      : '';

  bags.forEach((bag, bagIndex) => {
    const drawn = [];

    bag.forEach((actual, drawIndex) => {
      const isFirst = drawIndex === 0;
      const past = history.slice();        // earlier bags, still on screen
      const snapshot = drawn.slice();      // this bag, before the draw

      if (CONFIG.ASK_ON_FIRST_DRAW || !isFirst) {
        let keyHandler = null;
        timeline.push({
          type: jsPsychHtmlButtonResponse,
          stimulus: () =>
            '<div class="screen">' + tag +
              scene(past, { index: bagIndex + 1, items: snapshot,
                           remaining: bag.length - snapshot.length,
                           awaiting: true,
                           newAt: drawIndex > 0 ? snapshot.length - 1 : -1 },
                    echo()) +
              '<p class="prompt">Which color will come out next?</p>' +
            '</div>',
          choices: choices,
          button_html: (choice, i) =>
            '<span class="tilewrap">' +
              '<button class="jspsych-btn tile-btn tile-' + choice +
              '" data-choice="' + i + '" title="' + escapeHtml(colorName(choice)) + '" ' +
              'aria-label="' + escapeHtml(colorName(choice)) + '"></button>' +
              '<span class="tilename">' + escapeHtml(colorName(choice)) + '</span>' +
            '</span>',
          on_load: () => { keyHandler = attachKeyboard(choices); },
          on_finish: data => {
            if (keyHandler) document.removeEventListener("keydown", keyHandler);
            data.predicted = choices[data.response];
            data.correct = data.predicted === actual;
            lastChoice = data.predicted;
          },
          data: {
            screen: "prediction",
            is_practice: !!opts.practice,
            group: pattern.group,
            pattern_id: pattern.id,
            pattern_name: pattern.name,
            pattern_order: patternIndex + 1,
            bag_index: bagIndex + 1,
            draw_index: drawIndex + 1,
            draws_in_bag: bag.length,
            is_first_draw_of_bag: isFirst,
            actual: actual,
            context: snapshot.join(""),
            bag_string: bag.join(""),
            letter_map: JSON.stringify(map),
            n_evidence_bag1: pattern.n_evidence_bag1,
            n_critical_later: pattern.n_critical_later,
            n_elements_in_pred: pattern.n_elements_in_pred
          }
        });
      }

      drawn.push(actual);
    });

    history.push(drawn.slice());
    const emptied = history.slice();

    timeline.push(continueTrial(
      () => '<div class="screen">' + tag + scene(emptied, null, echo()) + '</div>',
      { screen: "bag_end", pattern_id: pattern.id, bag_index: bagIndex + 1,
        is_practice: !!opts.practice },
      bagIndex < bags.length - 1
        ? "Start " + CONFIG.SEQ_WORD + " " + (bagIndex + 2)
        : "Continue",
      () => {
        lastChoice = null;
        if (bagIndex === bags.length - 1 && !opts.practice && typeof markSetComplete === "function") {
          markSetComplete();
        }
      }));   // a new bag starts with a clean caption
  });

  return { timeline: timeline, letter_map: map };
}

</script>
<script>
/* ------------------------------------------------------------------
   Developer panel. Off for participants; on with ?dev=1 (or by setting
   DEV_PANEL in config.js). Shows which rule is running and jumps to any
   other one. Keep it off for a live HIT.
   ------------------------------------------------------------------ */

const DEV = params.get("dev") === "1" || CONFIG.DEV_PANEL === true;
// Jumping between rules skips consent/instructions unless told otherwise.
const SKIP_INTRO = DEV && params.get("intro") !== "1";

function devURL(patternId, keepIntro) {
  const q = ["dev=1"];
  if (patternId) q.push("pattern=" + encodeURIComponent(patternId));
  if (keepIntro) q.push("intro=1");
  return window.location.pathname + "?" + q.join("&");
}

/* Which rule the panel is currently describing. A session can run
   several rules in a row, so this follows the timeline. */
let DEV_SHOWING = null;

function renderDevPanel(assigned) {
  if (!DEV) return;
  const current = assigned[0];
  DEV_SHOWING = current ? current.id : null;
  const groups = [];
  PATTERNS.forEach(p => {
    const name = "Study " + p.studies.join("+") + " · " + p.group;
    let g = groups.find(x => x.name === name);
    if (!g) { g = { name: name, items: [] }; groups.push(g); }
    g.items.push(p);
  });

  const options = groups.map(g =>
    '<optgroup label="' + escapeHtml(g.name) + '">' +
    g.items.map(p =>
      '<option value="' + p.id + '"' +
      (current && p.id === current.id ? " selected" : "") + '>' +
      escapeHtml(p.name) + (p.valid ? "" : "  ⚠ non-ABCD") + "</option>").join("") +
    "</optgroup>").join("");

  const el = document.createElement("div");
  el.id = "devpanel";
  el.innerHTML =
    '<div class="dp-head"><span>DEV</span>' +
      '<button id="dp-fold" title="collapse">–</button></div>' +
    '<div class="dp-body">' +
      '<div class="dp-now">' +
        '<div class="dp-group">' + escapeHtml(current ? current.group : "—") + '</div>' +
        '<div class="dp-name">' + escapeHtml(current ? current.name : "—") + '</div>' +
      '</div>' +
      '<div class="dp-status" id="dp-status">not started</div>' +
      '<div class="dp-bags">' +
        (current ? current.bags.map((b, i) =>
          '<div><span>' + (i + 1) + '</span>' + escapeHtml(b) + '</div>').join("") : "") +
      '</div>' +
      '<label class="dp-field">jump to rule' +
        '<select id="dp-jump">' + options + '</select></label>' +
      '<label class="dp-check"><input type="checkbox" id="dp-intro"' +
        (params.get("intro") === "1" ? " checked" : "") + '> show intro screens</label>' +
      '<div class="dp-links">' +
        '<a href="' + devURL(null, params.get("intro") === "1") + '">random rule</a>' +
        '<a href="' + window.location.pathname + '">exit dev</a>' +
      '</div>' +
    '</div>';
  document.body.appendChild(el);

  const keepIntro = () => document.getElementById("dp-intro").checked;
  document.getElementById("dp-jump").onchange = e =>
    { window.location.href = devURL(e.target.value, keepIntro()); };
  document.getElementById("dp-intro").onchange = () =>
    { window.location.href = devURL(document.getElementById("dp-jump").value, keepIntro()); };
  document.getElementById("dp-fold").onclick = () =>
    el.classList.toggle("folded");
}

/* Retarget the panel when the timeline moves on to the next rule. */
function devShowPattern(id) {
  if (id === DEV_SHOWING) return;
  const p = PATTERNS.filter(x => x.id === id)[0];
  if (!p) return;
  DEV_SHOWING = id;
  document.querySelector("#devpanel .dp-group").textContent = p.group;
  document.querySelector("#devpanel .dp-name").textContent = p.name;
  document.querySelector("#devpanel .dp-bags").innerHTML =
    p.bags.map((b, i) =>
      '<div><span>' + (i + 1) + '</span>' + escapeHtml(b) + '</div>').join("");
  document.getElementById("dp-jump").value = id;
}

/* Live position readout, driven by each trial's own data. */
function devStatus(trial) {
  if (!DEV) return;
  const box = document.getElementById("dp-status");
  if (!box) return;
  const d = (trial && trial.data) || {};
  if (d.pattern_id) devShowPattern(d.pattern_id);
  let text;
  if (d.screen === "prediction") {
    text = "bag " + d.bag_index + " · predicting draw " +
           d.draw_index + " of " + d.draws_in_bag;
  } else if (d.screen === "bag_end") {
    text = "bag " + d.bag_index + " empty";
  } else {
    text = d.screen || trial.type.info.name;
  }
  box.textContent = text;
}

</script>
<script>
/* ------------------------------------------------------------------
   OH Study - timeline assembly, consent, debrief, data handoff.
   ------------------------------------------------------------------ */

const jsPsych = initJsPsych({
  display_element: "jspsych-target",
  on_trial_start: trial => devStatus(trial),
  on_data_update: () => scheduleAutosave(),
  on_finish: () => finishUp()
});

let autosaveTimer = null;
let lastAutosaveSignature = null;

/* Session-level metadata attached to every row of the data file. */
const SESSION_ID = "s" + Date.now().toString(36) +
                   Math.random().toString(36).slice(2, 7);

jsPsych.data.addProperties({
  session_id: SESSION_ID,
  completion_code: COMPLETION_CODE,
  worker_id: TURK.workerId,
  assignment_id: TURK.assignmentId,
  hit_id: TURK.hitId,
  study_version: "1.0",
  user_agent: navigator.userAgent,
  started_at: new Date().toISOString()
});

/* ---------- Consent PDF pre-screen -------------------------------- */
const consentPdfState = { doc: null, page: 1 };

function updateConsentAcceptState() {
  const accept = document.querySelector('#jspsych-html-button-response-btngroup .jspsych-btn[data-choice="0"]');
  if (!accept) return;
  const canAccept = !!consentPdfState.doc && consentPdfState.page >= consentPdfState.doc.numPages;
  accept.disabled = !canAccept;
  accept.setAttribute('aria-disabled', String(!canAccept));
  accept.title = canAccept ? "" : "Read the final consent page before accepting.";
}

function renderConsentPdfPage() {
  if (!consentPdfState.doc) return;
  const canvas = document.getElementById("consent-pdf-canvas");
  const pageCount = document.getElementById("consent-pdf-pagecount");
  const prev = document.getElementById("consent-pdf-prev");
  const next = document.getElementById("consent-pdf-next");
  if (!canvas || !pageCount || !prev || !next) return;

  consentPdfState.doc.getPage(consentPdfState.page).then(page => {
    const viewport = page.getViewport({ scale: 1.1 });
    const maxWidth = 760;
    const scale = Math.min(maxWidth / viewport.width, 1.25);
    const scaled = page.getViewport({ scale });
    canvas.width = scaled.width;
    canvas.height = scaled.height;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    page.render({ canvasContext: ctx, viewport: scaled }).promise.catch(() => {});
    pageCount.textContent = "Page " + consentPdfState.page + " of " + consentPdfState.doc.numPages;
    prev.disabled = consentPdfState.page <= 1;
    next.disabled = consentPdfState.page >= consentPdfState.doc.numPages;
    updateConsentAcceptState();
  }).catch(() => {
    pageCount.textContent = "Page unavailable";
    updateConsentAcceptState();
  });
}

function navigateConsentPdf(delta) {
  if (!consentPdfState.doc) return;
  consentPdfState.page = Math.min(consentPdfState.doc.numPages,
    Math.max(1, consentPdfState.page + delta));
  renderConsentPdfPage();
}

function initializeConsentPdfViewer() {
  const status = document.getElementById("consent-pdf-status");
  const canvas = document.getElementById("consent-pdf-canvas");
  const prev = document.getElementById("consent-pdf-prev");
  const next = document.getElementById("consent-pdf-next");

  if (!window.pdfjsLib) {
    if (status) status.textContent = "Consent PDF viewer unavailable in this browser.";
    if (canvas) canvas.style.display = "none";
    if (prev) prev.disabled = true;
    if (next) next.disabled = true;
    return;
  }

  const pdfUrl = CONSENT_PDF_NAME;
  const viewerReady = () => {
    if (status) status.textContent = "Loading consent form…";
    fetch(pdfUrl, { method: "HEAD" })
      .then(r => {
        if (!r.ok) throw new Error("Missing consent PDF");
        return window.pdfjsLib.getDocument({ url: pdfUrl }).promise;
      })
      .then(doc => {
        consentPdfState.doc = doc;
        consentPdfState.page = 1;
        renderConsentPdfPage();
      })
      .catch(() => {
        if (status) status.textContent = "Consent PDF not found. Please place " + CONSENT_PDF_NAME + " in the project folder.";
        if (canvas) canvas.style.display = "none";
        if (prev) prev.disabled = true;
        if (next) next.disabled = true;
        updateConsentAcceptState();
      });
  };

  if (prev) prev.onclick = () => navigateConsentPdf(-1);
  if (next) next.onclick = () => navigateConsentPdf(1);
  document.addEventListener("keydown", e => {
    if (!consentPdfState.doc) return;
    if (e.key === "ArrowLeft") navigateConsentPdf(-1);
    if (e.key === "ArrowRight") navigateConsentPdf(1);
  }, { once: false });
  viewerReady();
}

const consentPdf = {
  type: jsPsychHtmlButtonResponse,
  stimulus: () =>
    '<div class="screen text consent-pdf-page">' +
      '<h1>Consent Form</h1>' +
      '<div class="consent-pdf-shell">' +
        '<button type="button" class="consent-pdf-arrow" id="consent-pdf-prev" aria-label="Previous page">&#8592;</button>' +
        '<div class="consent-pdf-viewer">' +
          '<div id="consent-pdf-status" class="consent-pdf-status">Loading consent form…</div>' +
          '<canvas id="consent-pdf-canvas"></canvas>' +
          '<div id="consent-pdf-pagecount" class="consent-pdf-pagecount">Page 1 of 1</div>' +
        '</div>' +
        '<button type="button" class="consent-pdf-arrow" id="consent-pdf-next" aria-label="Next page">&#8594;</button>' +
      '</div>' +
    '</div>',
  choices: ["Accept"],
  button_html: (c, i) => '<button class="jspsych-btn wide" id="consent-accept" data-choice="' + i + '" disabled>' + c + '</button>',
  on_load: initializeConsentPdfViewer,
  data: { screen: "consent_pdf" }
};

/* continueTrial gives every screen the same button, clickable or space.
   The stimulus is a function so the group count is read at run time from
   the patterns actually assigned rather than hard-coded here. */
const consent = continueTrial(
  () =>
    '<div class="screen text">' +
      '<h1>Prediction Task</h1>' +
      '<p>In this task, you will see multiple sequences of tiles. Your job is to predict the color of the next tile.</p>'+
    '<p>After making your guess, the next tile will be revealed. You will do this for each tile in the sequence.</p>' +
     '<p> You will then move on to the next sequence. There are four sequences per group, and there are 8-9 groups. </p>' +
     "<p> Let's start with a practice trial. Make sure you can see all the colors clearly. </p>"+
    '</div>',
  { screen: "consent" }, "Next");

/* ---------- Practice ----------------------------------------------- */
/* The warm-up teaches the mechanics, so it stands in for the old
   "How this works" / "Your job" pages. Its rows carry is_practice. */
const practicePattern = CONFIG.PRACTICE_PATTERN
  ? PATTERNS.filter(p => p.id === CONFIG.PRACTICE_PATTERN)[0]
  : null;

const practice = [];
if (practicePattern) {
  practice.push(...patternTimeline(practicePattern, 0, 1, {
    practice: true, nBags: CONFIG.PRACTICE_SEQUENCES
  }).timeline);
  practice.push(continueTrial(
    '<div class="screen text"><h2>That was practice</h2>' +
    '<p>The study starts now.</p>' +
    "<p> Please try your best! If you don't know what letter comes next, make your best guess.</p>"+
    '</div>',
    { screen: "practice_end" }, "Begin"));
} else if (CONFIG.PRACTICE_PATTERN) {
  console.warn('No pattern with id "' + CONFIG.PRACTICE_PATTERN +
               '"; running without practice.');
}

/* ---------- Main body --------------------------------------------- */
/* Filled in by buildBody() once the study is known - inside JATOS that is
   only after jatos.onLoad, since the ?study= on the link arrives there. */
let assigned = [];
const body = [];
let completedSets = 0;

function ensureProgressBar() {
  let bar = document.getElementById("study-progress");
  if (!bar) {
    bar = document.createElement("div");
    bar.id = "study-progress";
    bar.innerHTML =
      '<div class="study-progress-track">' +
        '<div class="study-progress-fill"></div>' +
      '</div>' +
      '<div class="study-progress-label">0% complete</div>';
    document.body.insertBefore(bar, document.body.firstChild);
  }
  return bar;
}

function updateProgressBar() {
  const total = Math.max(assigned.length || 1, 1);
  const bar = ensureProgressBar();
  const fill = bar.querySelector(".study-progress-fill");
  const label = bar.querySelector(".study-progress-label");
  const pct = Math.min(Math.max((completedSets / total) * 100, 0), 100);
  if (fill) fill.style.width = pct + "%";
  if (label) label.textContent = Math.round(pct) + "% complete";
}

function markSetComplete() {
  completedSets += 1;
  updateProgressBar();
}

function buildBody(linkParams) {
  STUDY = resolveStudy(linkParams);
  assigned = assignPatterns();
  jsPsych.data.addProperties({
    study: STUDY,
    assigned_patterns: assigned.map(p => p.id).join(","),
    n_patterns_assigned: assigned.length
  });

  assigned.forEach((pattern, i) => {
    const built = patternTimeline(pattern, i, assigned.length);
    body.push(...built.timeline);
    if (i < assigned.length - 1) {
      body.push(continueTrial(
        '<div class="screen text"><h2>Set completed</h2>' +
        '<p>That set of ' + CONFIG.SEQ_WORD + 's is finished. ' +
        'The next set is unrelated to the one you just saw.</p></div>',
        { screen: "break" }, "Continue"));
    }
  });
}

/* ---------- Back matter ------------------------------------------- */
const debrief = {
  type: jsPsychHtmlKeyboardResponse,
  choices: "NO_KEYS",
  trial_duration: 100,
  stimulus: '<div class="screen text"><p>Saving your data…</p></div>',
  data: { screen: "debrief" }
};

/* ---------- Run ---------------------------------------------------- */
/* ?dev=1 jumps straight to a rule, so it skips the intro and practice. */
const timeline = () => SKIP_INTRO
  ? [...body, debrief]
  : [consentPdf, consent, ...practice, ...body, debrief];

/* jatos.js is only present when the study is served by JATOS. Outside it
   (python server.py, file://, GitHub Pages) IN_JATOS is false and the old
   POST/download path is used unchanged. */
const IN_JATOS = typeof jatos !== "undefined";

function startStudy(linkParams) {
  buildBody(linkParams);
  updateProgressBar();
  if (IS_MTURK_PREVIEW) {
    document.getElementById("jspsych-target").innerHTML =
      '<div class="screen text"><h1>Preview mode</h1>' +
      '<p>You are previewing this HIT. <b>Accept the HIT</b> to start the study.</p>' +
      '<p>It takes about ' + CONFIG.ESTIMATED_MINUTES + ' minutes and pays ' +
      CONFIG.PAYMENT_TEXT + '.</p></div>';
  } else {
    renderDevPanel(assigned);
    jsPsych.run(timeline());
  }
}

/* Balanced assignment. The JATOS batch session keeps one counter per study
   ("oh_completed_1", "oh_completed_2") of finished participants. A new
   participant with no ?study= on the link gets the study with fewer
   completions (ties: coin flip). The counter is bumped when the data is
   saved (see saveToJatos). */
const COUNTER_KEY = s => "oh_completed_" + s;
const completedCount = s => Number(jatos.batchSession.get(COUNTER_KEY(s))) || 0;

function pickStudy(q) {
  if (linkStudy(q) !== null || String(CONFIG.STUDY) !== "balanced") return q;
  const studies = knownStudies();
  const low = Math.min(...studies.map(completedCount));
  const fewest = studies.filter(s => completedCount(s) === low);
  return Object.assign({}, q, {
    study: jsPsych.randomization.sampleWithoutReplacement(fewest, 1)[0]
  });
}

if (IN_JATOS) {
  /* JATOS ids exist only once jatos.js has loaded the study run, so they are
     attached here rather than with the other session metadata above. */
  jatos.onLoad(() => {
    jsPsych.data.addProperties({
      jatos_study_id: jatos.studyId,
      jatos_study_title: jatos.studyProperties ? jatos.studyProperties.title : "",
      jatos_component_id: jatos.componentId,
      jatos_study_result_id: jatos.studyResultId,
      jatos_component_result_id: jatos.componentResultId,
      jatos_worker_id: jatos.workerId,
      jatos_worker_type: jatos.workerType || "",
      jatos_batch_id: jatos.batchId,
      jatos_group_result_id: jatos.groupResultId || ""
    });

    /* Query parameters on the study link (?PROLIFIC_PID=..., ?workerId=...)
       reach the study through JATOS, not through window.location, so fill in
       any TURK field that was empty. */
    const q = jatos.urlQueryParameters || {};
    const fromLink = {
      workerId: q.workerId || q.PROLIFIC_PID || q.participantId || "",
      assignmentId: q.assignmentId || q.SESSION_ID || "",
      hitId: q.hitId || q.STUDY_ID || ""
    };
    Object.keys(fromLink).forEach(k => { if (!TURK[k] && fromLink[k]) TURK[k] = fromLink[k]; });
    jsPsych.data.addProperties({
      worker_id: TURK.workerId,
      assignment_id: TURK.assignmentId,
      hit_id: TURK.hitId,
      url_query_parameters: JSON.stringify(q)
    });

    startStudy(pickStudy(q));
  });
} else {
  startStudy();
}

/* ---------- End of study ------------------------------------------ */
/* GitHub Pages (and a file:// copy) have no /save endpoint. Posting there
   would fail and show the participant an error about data they can't fix, so
   on a static host we skip the upload and offer the download instead. */
function saveEndpoint() {
  const staticHost = location.protocol === "file:" ||
                     /(^|\.)github\.io$/.test(location.hostname);
  return staticHost ? "" : CONFIG.SAVE_URL;
}

function currentCsv() {
  return jsPsych.data.get().ignore("stimulus").csv();
}

function partialFilename() {
  const suffix = TURK.workerId ? "_" + TURK.workerId : "";
  return SESSION_ID + suffix + "_partial.csv";
}

function scheduleAutosave() {
  if (!CONFIG.AUTO_SAVE) return;
  if (autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    saveCurrentData({ final: false, silent: true });
  }, CONFIG.AUTO_SAVE_INTERVAL_MS || 15000);
}

function saveCurrentData({ final = false, silent = false } = {}) {
  const clean = jsPsych.data.get().ignore("stimulus");
  const csv = clean.csv();
  const filename = final
    ? SESSION_ID + (TURK.workerId ? "_" + TURK.workerId : "") + ".csv"
    : partialFilename();
  const sig = (final ? "final:" : "partial:") + filename + ":" + csv.length;
  if (sig === lastAutosaveSignature && !final) return Promise.resolve(true);
  lastAutosaveSignature = sig;

  const done = (savedOk) => {
    if (!silent && !final) {
      console.warn(savedOk === false ? "Partial data save failed." : "Partial data saved.");
    }
    return savedOk;
  };

  if (IN_JATOS) {
    return Promise.resolve(jatos.submitResultData(final ? csv : csv))
      .then(() => done(true))
      .catch(e => {
        console.warn("Autosave to JATOS failed:", e);
        return done(false);
      });
  }

  const endpoint = saveEndpoint();
  if (!endpoint) {
    if (final) return Promise.resolve(null);
    return Promise.resolve(true);
  }

  return fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename: filename, csv: csv })
  }).then(r => done(r.ok)).catch(() => done(false));
}

function finishUp() {
  const clean = jsPsych.data.get().ignore("stimulus");
  const csv = clean.csv();
  const filename = SESSION_ID + (TURK.workerId ? "_" + TURK.workerId : "") + ".csv";

  const showDone = (savedOk) => {
    const el = document.getElementById("jspsych-target");
    el.innerHTML =
      '<div class="screen text">' +
        '<h1>Thank you</h1>' +
        '<p>Your completion code is:</p>' +
        '<div class="code">' + COMPLETION_CODE + '</div>' +
        (IN_JATOS && savedOk
          ? '<p><button class="jspsych-btn wide" id="jatos-finish">Finish</button></p>'
          : '') +
        (TURK.turkSubmitTo && TURK.assignmentId
          ? '<form method="POST" action="' + escapeHtml(TURK.turkSubmitTo) +
            '/mturk/externalSubmit">' +
            '<input type="hidden" name="assignmentId" value="' +
              escapeHtml(TURK.assignmentId) + '">' +
            '<input type="hidden" name="completionCode" value="' + COMPLETION_CODE + '">' +
            '<button class="jspsych-btn wide" type="submit">Submit HIT</button></form>'
          : '') +
        (savedOk === false
          ? '<p class="warn">We could not save your data' +
            (IN_JATOS ? ' to the server' : '') + '. Please contact the researcher.</p>' : '') +
      '</div>';
    const fin = document.getElementById("jatos-finish");
    if (fin) fin.onclick = () =>
      jatos.endStudy(true, "completed, code " + COMPLETION_CODE);
  };

  saveCurrentData({ final: true, silent: false })
    .then(savedOk => showDone(savedOk))
    .catch(() => showDone(false));
}

/* ---------- JATOS save --------------------------------------------- */
/* Result data goes into the component result (visible in the JATOS results
   page, exportable from there); the CSV is additionally attached as a result
   file when the JATOS version supports uploads. The study is only ended -
   which hands the participant back to JATOS / the batch end-URL - after the
   data is in, so a failed save never loses a session silently. */
function saveToJatos(clean, csv, filename, showDone) {
  const fmt = CONFIG.JATOS_RESULT_FORMAT || "csv";
  const payload = fmt === "json" ? clean.json()
                : fmt === "both" ? JSON.stringify({ csv: csv, trials: clean.values() })
                : csv;

  const upload = () => {
    if (!CONFIG.JATOS_UPLOAD_FILE || typeof jatos.uploadResultFile !== "function") {
      return Promise.resolve();
    }
    // Wrapped: older jatos.js returns a jQuery deferred, not a Promise.
    return Promise.resolve(jatos.uploadResultFile(csv, filename)).catch(e => {
      console.warn("JATOS result-file upload failed:", e);
    });
  };

  const countCompletion = () =>
    Promise.resolve(jatos.batchSession.set(
      COUNTER_KEY(STUDY), completedCount(STUDY) + 1)).catch(e => {
      console.warn("Could not update the completion counter:", e);
    });

  Promise.resolve(jatos.submitResultData(payload))
    .then(upload)
    .then(countCompletion)
    .then(() => {
      if (CONFIG.JATOS_END_BUTTON === false) {
        jatos.endStudy(true, "completed, code " + COMPLETION_CODE);
      } else {
        showDone(true);
      }
    })
    .catch(e => {
      console.error("JATOS save failed:", e);
      showDone(false);
    });
}

</script>
</body>
</html>
